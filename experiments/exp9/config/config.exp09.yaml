project:
  name: sdr_modulation_ai_exp09_rf_canonicalization_fusion
  seed: 42

sdr:
  center_freq: 433000000
  tx_device: hackrf
  rx_device: rtlsdr
  tx_sample_rate: 8000000
  rx_sample_rate: 2400000
  symbol_rate: 5000
  baseband_offset_hz: 500000

dataset:
  source_root: ../../exp8/data/processed
  root: ../data/processed
  window_size: 2048
  feature_mode: precomputed
  input_channels: 5
  spectral_bins: 128
  evidence_dim: 5
  symbol_samples: 32
  preload: false
  split_unit: session

model:
  type: resnet1d
  input_channels: 5
  num_classes: 3
  dropout: 0.35

experiment9:
  purpose: rf_canonicalization_feature_fusion_blind_classification
  exp8_reference:
    accuracy: 0.7306
    worst_recall: 0.7194
    bfsk_bpsk_to_bask_rate: 0.1272
  class_names: ["BASK", "BFSK", "BPSK"]
  protocol_blind:
    uses_payload_as_input: false
    uses_crc_as_input: false
    uses_preamble_sync_as_input: false
  success_minimum:
    accuracy: 0.76
    macro_f1: 0.76
    worst_recall: 0.73
    bask_recall: 0.72
    bfsk_recall: 0.75
    bpsk_recall: 0.74
    bfsk_bpsk_to_bask_rate: 0.09
  success_target:
    accuracy: 0.80
    macro_f1: 0.80
    worst_recall: 0.76
    bfsk_bpsk_to_bask_rate: 0.06

train:
  batch_size: 64
  smoke_epochs: 1
  epochs: 160
  learning_rate: 0.0003
  weight_decay: 0.01
  device: cuda
  seeds: [42, 43, 44]
  finetune:
    init_checkpoint: ../../exp8/results/exp08_multitask_resnet_margin/multitask_resnet1d_margin_seed43/checkpoints/best.pt
    partial_load: true
    freeze_backbone: false
  losses:
    multiclass_weight: 1.0
    bask_binary_weight: 0.45
    bfsk_bpsk_weight: 0.55
    contrastive_weight: 0.0
    margin_contrastive_weight: 0.08
    contrastive_temperature: 0.2
  checkpoint_selection:
    metric: exp09_balanced
    accuracy_weight: 0.30
    worst_recall_weight: 0.35
    bfsk_recall_weight: 0.20
    bpsk_recall_weight: 0.15
  sampler:
    enabled: true
    balance_keys: ["modulation", "session_id"]
    max_weight: 6.0

evaluation:
  condition_keys: ["session_id", "payload", "tx_vga_gain", "rx_gain", "baseband_offset_hz", "snr_db", "exp09_estimated_cfo_hz"]
