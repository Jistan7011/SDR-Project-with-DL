project:
  name: sdr_modulation_ai_exp05_bfsk_bpsk_improvement
  seed: 42

sdr:
  center_freq: 433000000
  tx_device: hackrf
  rx_device: rtlsdr
  tx_sample_rate: 8000000
  rx_sample_rate: 2400000
  rx_sample_rate_fallback: 2048000
  symbol_rate: 5000
  tx_gain: 0
  tx_amp_gain: 0
  tx_vga_gain: 30
  rx_gain: 30
  baseband_offset_hz: 500000

frame:
  preamble: "1010101010101010"
  sync_word: "11001100"
  crc: crc8
  payload_bytes: 1
  total_bits: 40

modulation:
  classes: ["BASK", "BFSK", "BPSK"]
  payloads: ["A", "F", "P", "0", "1", "7", "K", "R", "S", "Z"]

dataset:
  root: ../data/processed
  window_size: 2048
  feature_mode: iq_mag_ifreq_dphase
  preload: false
  target_sample_rate: 160000
  channel_bandwidth_hz: 100000
  split_unit: session

experiment5:
  purpose: improve_bfsk_bpsk_recall_and_reduce_bask_false_positives
  rf_path: ota_antenna
  rf_cable_between_sdr: false
  tx_rx_distance_m: 1.0
  antenna_layout: face_to_face
  exp4_raw_root: ../../exp4/data/raw_iq
  exp5_raw_root: ../data/raw_iq
  exp4_baseline_checkpoint: ../../exp4/results/exp04_resnet_finetune/checkpoints/best.pt
  active_start_seconds: 1.1
  active_duration_seconds: 5.0
  classification_windows_per_capture: 20
  minimum_sessions: 30
  split_policy:
    train:
      ["session_001", "session_002", "session_003", "session_004", "session_005", "session_006", "session_007",
       "session_008", "session_009", "session_010", "session_011", "session_012", "session_016", "session_017",
       "session_018", "session_019", "session_020", "session_021", "session_022", "session_023", "session_024"]
    val: ["session_013", "session_014", "session_015", "session_025", "session_026"]
    test: ["session_027", "session_028", "session_029", "session_030"]
  session_plan:
    - {session_id: session_016, tx_vga_gain: 25, rx_gain: 30, baseband_offset_hz: 500000, antenna_note: face_to_face_center}
    - {session_id: session_017, tx_vga_gain: 30, rx_gain: 30, baseband_offset_hz: 500000, antenna_note: face_to_face_center}
    - {session_id: session_018, tx_vga_gain: 35, rx_gain: 30, baseband_offset_hz: 500000, antenna_note: face_to_face_center}
    - {session_id: session_019, tx_vga_gain: 30, rx_gain: 25, baseband_offset_hz: 500000, antenna_note: face_to_face_center}
    - {session_id: session_020, tx_vga_gain: 30, rx_gain: 35, baseband_offset_hz: 500000, antenna_note: face_to_face_center}
    - {session_id: session_021, tx_vga_gain: 25, rx_gain: 30, baseband_offset_hz: 250000, antenna_note: face_to_face_center}
    - {session_id: session_022, tx_vga_gain: 30, rx_gain: 30, baseband_offset_hz: 250000, antenna_note: face_to_face_center}
    - {session_id: session_023, tx_vga_gain: 35, rx_gain: 30, baseband_offset_hz: 250000, antenna_note: face_to_face_center}
    - {session_id: session_024, tx_vga_gain: 30, rx_gain: 25, baseband_offset_hz: 250000, antenna_note: face_to_face_center}
    - {session_id: session_025, tx_vga_gain: 30, rx_gain: 35, baseband_offset_hz: 250000, antenna_note: face_to_face_center}
    - {session_id: session_026, tx_vga_gain: 32, rx_gain: 28, baseband_offset_hz: 500000, antenna_note: slight_angle_15deg}
    - {session_id: session_027, tx_vga_gain: 28, rx_gain: 32, baseband_offset_hz: 500000, antenna_note: slight_angle_15deg}
    - {session_id: session_028, tx_vga_gain: 32, rx_gain: 28, baseband_offset_hz: 250000, antenna_note: slight_angle_15deg}
    - {session_id: session_029, tx_vga_gain: 28, rx_gain: 32, baseband_offset_hz: 250000, antenna_note: slight_angle_15deg}
    - {session_id: session_030, tx_vga_gain: 30, rx_gain: 30, baseband_offset_hz: 500000, antenna_note: height_offset_small}

model:
  type: resnet1d
  input_channels: 5
  num_classes: 3
  dropout: 0.35

train:
  batch_size: 64
  smoke_epochs: 1
  epochs: 120
  learning_rate: 0.00035
  optimizer: adamw
  loss: cross_entropy
  device: cuda
  finetune:
    init_checkpoint: ../../exp4/results/exp04_resnet_finetune/checkpoints/best.pt
    partial_load: true
    freeze_backbone: false
  checkpoint_selection:
    metric: balanced_score
    accuracy_weight: 0.35
  sampler:
    enabled: true
    balance_keys: ["modulation", "session_id"]
    max_weight: 5.0
  augmentation:
    enabled: true
    time_shift: true
    max_time_shift: 96
    phase_rotation: true
    frequency_jitter: true
    max_frequency_jitter_cycles: 1.5
    amplitude_scale: true
    min_amplitude_scale: 0.85
    max_amplitude_scale: 1.15

evaluation:
  focus_classes: ["BFSK", "BPSK"]
  success_minimum:
    accuracy: 0.78
    bfsk_recall: 0.75
    bpsk_recall: 0.75
    worst_recall: 0.74
    bask_recall: 0.75
  success_target:
    accuracy: 0.82
    macro_f1: 0.82
    bfsk_bpsk_to_bask_error_reduction: 0.35
