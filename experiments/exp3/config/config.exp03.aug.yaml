project:
  name: sdr_modulation_ai_exp03_aug
  seed: 42

sdr:
  center_freq: 433000000
  tx_device: hackrf
  rx_device: rtlsdr
  tx_sample_rate: 8000000
  rx_sample_rate: 2400000
  rx_sample_rate_fallback: 2048000
  symbol_rate: 5000
  tx_gain: 0
  tx_amp_gain: 0
  tx_vga_gain: 30
  rx_gain: 30
  baseband_offset_hz: 500000

frame:
  preamble: "1010101010101010"
  sync_word: "11001100"
  crc: "crc8"

modulation:
  classes: ["BASK", "BFSK", "BPSK"]
  payloads: ["A", "F", "P", "0", "1", "7", "K", "R", "S", "Z"]

dataset:
  root: ../data/processed
  window_size: 1024
  feature_mode: iq_magnitude_instantaneous_frequency
  target_sample_rate: 160000
  channel_bandwidth_hz: 100000
  split_unit: session

experiment3:
  purpose: 1m_ota_distance_generalization_feature_fusion_augmented
  rf_path: ota_antenna
  rf_cable_between_sdr: false
  tx_rx_distance_m: 1.0
  antenna_layout: face_to_face
  payload_pool: ["A", "F", "P", "0", "1", "7", "K", "R", "S", "Z"]

model:
  type: fusion_resnet1d
  input_channels: 4
  num_classes: 3
  dropout: 0.35

train:
  batch_size: 64
  smoke_epochs: 2
  epochs: 30
  learning_rate: 0.001
  optimizer: adamw
  loss: cross_entropy
  device: cuda
  augmentation:
    enabled: true
    time_shift: true
    max_time_shift: 64
    phase_rotation: true
    frequency_jitter: true
    max_frequency_jitter_cycles: 3.0
    amplitude_scale: true
    min_amplitude_scale: 0.75
    max_amplitude_scale: 1.25

evaluation:
  metrics: ["accuracy", "confusion_matrix", "precision", "recall", "f1"]
  primary_split: test_b
  comparison_splits: ["test_a", "test_b"]
