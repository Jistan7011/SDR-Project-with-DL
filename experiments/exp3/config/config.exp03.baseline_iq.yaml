project:
  name: sdr_modulation_ai_exp03_baseline_iq_eval
  seed: 42

sdr:
  center_freq: 433000000
  tx_device: hackrf
  rx_device: rtlsdr
  tx_sample_rate: 8000000
  rx_sample_rate: 2400000
  rx_sample_rate_fallback: 2048000
  symbol_rate: 5000
  tx_gain: 0
  tx_amp_gain: 0
  tx_vga_gain: 30
  rx_gain: 30
  baseband_offset_hz: 500000

frame:
  preamble: "1010101010101010"
  sync_word: "11001100"
  crc: "crc8"

modulation:
  classes: ["BASK", "BFSK", "BPSK"]
  payloads: ["A", "F", "P", "0", "1", "7", "K", "R", "S", "Z"]

dataset:
  root: ../data/processed
  window_size: 1024
  feature_mode: iq
  preload: true
  target_sample_rate: 160000
  channel_bandwidth_hz: 100000
  split_unit: session

model:
  type: resnet1d
  input_channels: 2
  num_classes: 3
  dropout: 0.3

train:
  batch_size: 256
  smoke_epochs: 1
  epochs: 5
  learning_rate: 0.001
  optimizer: adamw
  loss: cross_entropy
  device: cuda
  augmentation:
    enabled: false

evaluation:
  metrics: ["accuracy", "confusion_matrix", "precision", "recall", "f1"]
  primary_split: test_b
  comparison_splits: ["test_a", "test_b"]
