    val:
      ["session_013", "session_014", "session_015", "session_025", "session_026",
       "session_052", "session_053", "session_054", "session_055"]
    test:
      ["session_027", "session_028", "session_029", "session_030",
       "session_056", "session_057", "session_058", "session_059", "session_060"]
  decisions:
    hard: ["BASK", "BFSK", "BPSK"]
    ambiguous:
      - AMBIGUOUS_BASK_LIKE_WITH_BFSK_EVIDENCE
      - AMBIGUOUS_BASK_LIKE_WITH_BPSK_EVIDENCE
      - UNKNOWN_LOW_CONFIDENCE

train:
  batch_size: 64
  smoke_epochs: 1
  base_epochs: 160
  guard_epochs: 120
  learning_rate: 0.00035
  guard_learning_rate: 0.001
  device: cuda
  seeds: [42, 43, 44]
  finetune:
    init_checkpoint: ../../exp5/results/exp05_resnet_2048/resnet1d_seed42/checkpoints/best.pt
    partial_load: true
    freeze_backbone: false
  checkpoint_selection:
    metric: balanced_score
    accuracy_weight: 0.35
  sampler:
    enabled: true
    balance_keys: ["modulation", "session_id"]
    max_weight: 5.0
  augmentation:
    enabled: true
    time_shift: true
    max_time_shift: 96
    phase_rotation: true
    frequency_jitter: true
    max_frequency_jitter_cycles: 1.5
    amplitude_scale: true
    min_amplitude_scale: 0.85
    max_amplitude_scale: 1.15

