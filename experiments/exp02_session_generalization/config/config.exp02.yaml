project:
  name: sdr_modulation_ai
  seed: 42

sdr:
  center_freq: 433000000
  tx_device: hackrf
  rx_device: rtlsdr
  tx_sample_rate: 8000000
  rx_sample_rate: 2400000
  symbol_rate: 5000
  tx_gain: 0
  tx_amp_gain: 0
  tx_vga_gain: 20
  rx_gain: 30

frame:
  preamble: "1010101010101010"
  sync_word: "11001100"
  crc: "crc8"

modulation:
  classes: ["BASK", "BFSK", "BPSK"]
  payloads: ["A", "F", "P"]

dataset:
  root: experiments/exp02_session_generalization/data/processed
  window_size: 1024
  samples_per_class:
    smoke: 18
    train: 600
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_unit: session

awgn:
  snr_list: [-10, -5, 0, 5, 10, 15, 20]

model:
  type: cnn1d
  input_channels: 2
  num_classes: 3
  dropout: 0.3

train:
  batch_size: 64
  smoke_epochs: 2
  epochs: 30
  learning_rate: 0.001
  optimizer: adamw
  loss: cross_entropy
  device: cuda

evaluation:
  metrics: ["accuracy", "confusion_matrix", "precision", "recall", "f1", "ber", "cer", "throughput"]
